<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Viajantes</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌍 Cadastro de Viajantes</h1>
            <p>Preencha seus dados para garantir a melhor experiência na sua próxima jornada!</p>
        </header>
        
        <form id="formViajante">
            <!-- Dados Pessoais -->
            <fieldset>
                <legend>Dados Pessoais</legend>
                
                <div class="input-group">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" required placeholder="Digite seu nome completo">
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label for="cpf">CPF:</label>
                        <input type="text" id="cpf" required placeholder="000.000.000-00" maxlength="14">
                    </div>
                    <div class="input-group">
                        <label for="nascimento">Data de Nascimento:</label>
                        <input type="date" id="nascimento" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" required placeholder="seu@email.com">
                    </div>
                    <div class="input-group">
                        <label for="telefone">Telefone / WhatsApp:</label>
                        <input type="tel" id="telefone" required placeholder="(00) 00000-0000">
                    </div>
                </div>
            </fieldset>

            <!-- Endereço -->
            <fieldset>
                <legend>Endereço</legend>
                
                <div class="form-row">
                    <div class="input-group">
                        <label for="cep">CEP:</label>
                        <input type="text" id="cep" required placeholder="00000-000" maxlength="9">
                    </div>
                    <div class="input-group">
                        <label for="cidade">Cidade:</label>
                        <input type="text" id="cidade" required placeholder="Sua cidade">
                    </div>
                    <div class="input-group">
                        <label for="estado">Estado:</label>
                        <select id="estado" required>
                            <option value="">Selecione</option>
                            <option value="AC">Acre</option>
                            <option value="AL">Alagoas</option>
                            <option value="AP">Amapá</option>
                            <option value="AM">Amazonas</option>
                            <option value="BA">Bahia</option>
                            <option value="CE">Ceará</option>
                            <option value="DF">Distrito Federal</option>
                            <option value="ES">Espírito Santo</option>
                            <option value="GO">Goiás</option>
                            <option value="MA">Maranhão</option>
                            <option value="MT">Mato Grosso</option>
                            <option value="MS">Mato Grosso do Sul</option>
                            <option value="MG">Minas Gerais</option>
                            <option value="PA">Pará</option>
                            <option value="PB">Paraíba</option>
                            <option value="PR">Paraná</option>
                            <option value="PE">Pernambuco</option>
                            <option value="PI">Piauí</option>
                            <option value="RJ">Rio de Janeiro</option>
                            <option value="RN">Rio Grande do Norte</option>
                            <option value="RS">Rio Grande do Sul</option>
                            <option value="RO">Rondônia</option>
                            <option value="RR">Roraima</option>
                            <option value="SC">Santa Catarina</option>
                            <option value="SP">São Paulo</option>
                            <option value="SE">Sergipe</option>
                            <option value="TO">Tocantins</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="input-group span-2">
                        <label for="endereco">Logradouro (Rua, Avenida, etc.):</label>
                        <input type="text" id="endereco" required placeholder="Nome da rua">
                    </div>
                    <div class="input-group">
                        <label for="numero">Número:</label>
                        <input type="text" id="numero" required placeholder="Nº">
                    </div>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label for="complemento">Complemento:</label>
                        <input type="text" id="complemento" placeholder="Apto, Bloco, Casa 2...">
                    </div>
                    <div class="input-group">
                        <label for="bairro">Bairro:</label>
                        <input type="text" id="bairro" required placeholder="Seu bairro">
                    </div>
                </div>
            </fieldset>

            <button type="submit" class="btn-enviar">Cadastrar Viajante</button>
        </form>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
